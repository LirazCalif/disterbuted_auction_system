version: '3.8'

services:
  # TRAEFIK
  traefik:
    image: traefik:v2.10
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"                    # Entry point for ALL client requests
      - "8888:8080"                # Traefik Dashboard 
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - paxos-net

  # ETCD
  etcd:
    image: gcr.io/etcd-development/etcd:v3.5.0
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    ports:
      - "2379:2379"
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - paxos-net

  # PAXOS SERVERS
  server0:
    build: { context: ../../, dockerfile: src/docker/Dockerfile }
    command: ["./paxos_server", "--id=0", "--n=12"]
    ports: ["8080:8080"]
    volumes:
      - ./data/server0:/app/data
    environment:
      - ETCD_ENDPOINTS=etcd:2379
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/info"]
      interval: 10s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.server0.rule=PathPrefix(`/`)"
      - "traefik.http.services.paxos-cluster.loadbalancer.server.port=8080"
    networks:
      - paxos-net
    depends_on: [etcd]

  server1:
    build: { context: ../../, dockerfile: src/docker/Dockerfile }
