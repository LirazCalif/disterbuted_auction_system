version: '3.8'

services:
  etcd:
      image: gcr.io/etcd-development/etcd:v3.5.0
      command: >
        /usr/local/bin/etcd
        --name s1
        --data-dir /etcd-data
        --listen-client-urls http://0.0.0.0:2379
        --advertise-client-urls http://etcd:2379
        --listen-peer-urls http://0.0.0.0:2380
        --initial-advertise-peer-urls http://etcd:2380
        --initial-cluster s1=http://etcd:2380
        --initial-cluster-token tkn
        --initial-cluster-state new
      ports:
        - "2379:2379"
      networks:
      - paxos-net
      healthcheck:
        test: ["CMD", "etcdctl", "endpoint", "health"]
        interval: 5s
        timeout: 5s
        retries: 3
  gateway:
    image: nginx:alpine
    ports:
      - "80:80" 
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - paxos-net
    depends_on:
      - server0
      - server1
      - server2
      - server3
      - server4
      - server5
      - server6
      - server7
      - server8
      - server9
      - server10
      - server11
       

  server0:
    build: { context: ../../, dockerfile: src/docker/Dockerfile }
    command: ["./paxos_server", "--id=0"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
    mem_limit: 512m
    ports:
      - "8080:8080"
    networks:
      - paxos-net
    depends_on:
      etcd:
        condition: service_healthy

  server1:
    build: { context: ../../, dockerfile: src/docker/Dockerfile }
    command: ["./paxos_server", "--id=1"]
    environment:
      - ETCD_ENDPOINTS=etcd:2379
