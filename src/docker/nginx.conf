events { 
    worker_connections 1024; 
}

http {
    upstream paxos_cluster {
        server server0:8080  max_fails=3 fail_timeout=5s;
        server server1:8081  max_fails=3 fail_timeout=5s;
        server server2:8082  max_fails=3 fail_timeout=5s;
        server server3:8083  max_fails=3 fail_timeout=5s;
        server server4:8084  max_fails=3 fail_timeout=5s;
        server server5:8085  max_fails=3 fail_timeout=5s;
        server server6:8086  max_fails=3 fail_timeout=5s;
        server server7:8087  max_fails=3 fail_timeout=5s;
        server server8:8088  max_fails=3 fail_timeout=5s;
        server server9:8089  max_fails=3 fail_timeout=5s;
        server server10:8090  max_fails=3 fail_timeout=5s;
        server server11:8091 max_fails=3 fail_timeout=5s;
    }

    server {
        listen 80;


        location /api/ {
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000;
                add_header 'Content-Type' 'text/plain; charset=utf-8';
                add_header 'Content-Length' 0;
                return 204; 
            }
            # forward to cluster
            rewrite ^/api/(.*) /$1 break;
            proxy_pass http://paxos_cluster;

            proxy_set_header Connection '';
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;
            proxy_read_timeout 86400s;
            
          
        }
    }
}