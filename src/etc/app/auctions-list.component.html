<h2>Auctions</h2>

<div *ngIf="loading">Loading...</div>

<div *ngFor="let a of auctions" class="auction">
  <h3>{{ a.item_name }}</h3>
  <p>Highest Bid: {{ a.highest_bid }}</p>
  <p>Status: {{ a.is_open ? 'Open' : 'Closed' }}</p>

  <div *ngIf="a.is_open">
    <input #uid type="number" placeholder="User ID" />
    <input #amt type="number" placeholder="Bid amount" />
    <button (click)="placeBid(a, +uid.value, +amt.value)">Bid</button>
  </div>

  <button (click)="closeAuction(a, +uid.value)">Close</button>
</div>
