<nav>
  <div class="brand">
    <strong>{{ title() }}</strong>
  </div>

  <div class="nav-links">
    <a routerLink="/" 
       routerLinkActive="active" 
       [routerLinkActiveOptions]="{exact: true}">Active Auctions</a>
       
    <a routerLink="/create" 
       routerLinkActive="active">Create Auction</a>

    <div class="paxos-actions">

      <button *ngIf="!userId()" 
              class="paxos-btn" 
              (click)="register()"
              [disabled]="isBusy()">
        Get ID
      </button>
      
      <span *ngIf="userId()" class="id-badge">
        User ID: {{ userId() }}
      </span>

      <button class="paxos-btn sync-btn" 
              (click)="checkGlobalRevenue()"
              [disabled]="isBusy()">
        Sync Revenue
      </button>
      
      <span *ngIf="globalRevenue() !== null" class="revenue-text">
        Total: ${{ globalRevenue() }}
      </span>

      <button *ngIf="userId()" 
              class="logout-link" 
              (click)="logout()">
        Clear ID
      </button>
    </div>
  </div>
</nav>

<main>

  
  <router-outlet />

  <div class="observability-dashboard">
    <hr class="section-divider">
    
    @if (isBrowser) {
      <app-paxos-monitor />
    }
  </div>
</main>
