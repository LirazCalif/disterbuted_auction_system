<div class="create-container">
  <h2>Create New Auction</h2>

  <div class="form-group">
    <label>Item Name:</label>
    <input [(ngModel)]="auction.title" name="title" placeholder="e.g. Vintage Camera" required />
  </div>

  <div class="form-group">
    <label>Your Paxos User ID:</label>
    <input [(ngModel)]="auction.creatorID" name="creatorID" type="number" readonly />
    <small class="helper-text">(ID is auto filled from registration)</small>
  </div>

  <div class="form-group">
    <label>Starting Price ($):</label>
    <input [(ngModel)]="auction.startingPrice" name="startingPrice" type="number" min="0" />
  </div>

  <button (click)="submitForm()" [disabled]="!auction.title || auction.creatorID <= 0 || auction.startingPrice < 0 || isSubmitting()">
    {{ isSubmitting() ? 'reaching consensus' : 'propose auction to cluster' }}
  </button>

  <div *ngIf="successMessage" class="success">
    {{ successMessage }}
  </div>
</div>
